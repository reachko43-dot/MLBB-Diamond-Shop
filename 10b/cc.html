<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>លំហាត់អនុវត្ត</title>
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif; /* ឬប្រើ Font ខ្មែរដែលអ្នកមាន */
            text-align: center;
            margin-top: 50px;
        }
        .header-line {
            border-top: 3px solid green;
            border-bottom: 3px solid green;
            padding: 10px 0;
            margin: 0 auto 30px auto;
            width: 80%;
        }
        h1 {
            color: red;
            margin: 0;
            text-decoration: underline;
        }
        .content {
            line-height: 1.8;
            font-size: 1.2em;
        }
        .blue-text {
            color: blue;
        }
    </style>
</head>
<body>

    <div class="header-line">
        <h1>លំហាត់អនុវត្ត</h1>
    </div>

    <div class="content">
        <p>ax<sup>2</sup> + bx + c = 0</p>
        
        <p>H<sub>2</sub>O &nbsp; CO<sub>2</sub> &nbsp; CO<sub>3</sub> &nbsp; H<sub>2</sub>SO<sub>4</sub></p>
        
        <p>N<sup>o</sup></p>

        <div class="blue-text">
            <p>ខ្ញុំស្រឡាញ់ការសរសេរកូដ</p>
            <p>ធ្វើលំហាត់ចប់ចាំនិយាយរឿងស្នេហ៍</p>
        </div>
    </div>

</body>
</html>
